global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'agi-workers'
    static_configs:
      # This assumes the Python app exposes metrics on port 8000
      - targets: ['agi_workers:8000']
